<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocket Spotter</title>
  <style>
    #zoomNotice {
      position: fixed;
      left: 50%;
      bottom: 14px;
      z-index: 9999;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-family: Arial, sans-serif;
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
      transform: translateX(-50%);
    }
  </style>
  <style>
    body {
      margin: 0;
    }

    .launchesBox {
      margin: 10px;
      width: 180px;
      position: absolute;
      border-style: double;
      z-index: 100;
      background-image: linear-gradient(#2e0267, #502fc4);
      font-family: Arial;
      font-weight: normal;
      font-size: .5rem;
      text-shadow: 1px 1px black;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      /* Center the text horizontally */
      word-wrap: break-word;
      /* Ensure text wraps */
      overflow-wrap: break-word;
      /* Ensure text wraps */
      padding: 10px;
      /* Add padding to create space around the text */
    }

    #globeContainer {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    #globeCanvas {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <!-- Import map will be injected dynamically based on WebGPU support -->
</head>

<body>
  <div id="launchesBox" class="launchesBox">
    <h3>Launches</h3>
    <div id="launches"></div>
  </div>
  <div id="globeContainer">
    <canvas id="globeCanvas"></canvas>
  </div>
  </div>
  <script>
    (function () {
      var importMap = document.createElement('script');
      importMap.type = 'importmap';
      if (navigator.gpu) {
        importMap.textContent = JSON.stringify({
          imports: {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.tsl.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/",
            "jsm/": "https://cdn.jsdelivr.net/npm/three@0.172/examples/jsm/"
          }
        });
        var scriptSrc = '/static/js/index.js';
      } else {
        importMap.textContent = JSON.stringify({
          imports: {
            "three": "https://cdn.jsdelivr.net/npm/three@0.172/build/three.module.js",
            "jsm/": "https://cdn.jsdelivr.net/npm/three@0.172/examples/jsm/"
          }
        });
        var scriptSrc = '/static/js/index_WebGL.js';
      }
      document.currentScript.after(importMap);
      var script = document.createElement('script');
      script.type = 'module';
      script.src = scriptSrc;
      importMap.after(script);
    })();
  </script>
</body>

</html>
